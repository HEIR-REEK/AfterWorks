<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Use AI without surrendering judgement</title>
<desc>The tool can change your speed. It cannot take responsibility for the deliverable.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12" fill="#e8eefc"/>
<text x="135" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · ACADEMY</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Use AI without surrendering judgement</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">The tool can change your speed. It cannot take responsibility for the deliverable.</text>
<rect x="40" y="126" width="270" height="330" rx="14" fill="#f2fbf7" stroke="#bfe8d7" stroke-width="1.5" filter="url(#shadow)"/><rect x="58" y="146" width="190" height="24" rx="12" fill="#e8f8f1"/><text x="153.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">GREEN · SAFE</text><text x="58" y="194" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">General help, no client data</text><circle cx="66" cy="216" r="4" fill="#0f9d6b"/><text x="78" y="220" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Spell-check a word you already heard</text><circle cx="66" cy="250" r="4" fill="#0f9d6b"/><text x="78" y="254" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Explain a concept you will verify</text><circle cx="66" cy="284" r="4" fill="#0f9d6b"/><text x="78" y="288" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Organise your own revision notes</text><circle cx="66" cy="318" r="4" fill="#0f9d6b"/><text x="78" y="322" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Brainstorm questions about a brief</text><circle cx="66" cy="352" r="4" fill="#0f9d6b"/><text x="78" y="356" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Check a conversion against a rule</text><circle cx="66" cy="386" r="4" fill="#0f9d6b"/><text x="78" y="390" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Rehearse your own explanation</text><rect x="345" y="126" width="270" height="330" rx="14" fill="#fffaf0" stroke="#f0ddae" stroke-width="1.5" filter="url(#shadow)"/><rect x="363" y="146" width="190" height="24" rx="12" fill="#fff6df"/><text x="458.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c8870a" text-anchor="middle" opacity="1">AMBER · PERMITTED</text><text x="363" y="194" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Only with client approval + verification</text><circle cx="371" cy="216" r="4" fill="#c8870a"/><text x="383" y="220" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Draft non-confidential text</text><circle cx="371" cy="250" r="4" fill="#c8870a"/><text x="383" y="254" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">First-pass classification you check</text><circle cx="371" cy="284" r="4" fill="#c8870a"/><text x="383" y="288" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Summarise a public document</text><circle cx="371" cy="318" r="4" fill="#c8870a"/><text x="383" y="322" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Translate a phrase you can verify</text><circle cx="371" cy="352" r="4" fill="#c8870a"/><text x="383" y="356" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Suggest a first-pass checklist</text><circle cx="371" cy="386" r="4" fill="#c8870a"/><text x="383" y="390" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Explain a term, then check a source</text><rect x="650" y="126" width="270" height="330" rx="14" fill="#fdf4f2" stroke="#f0c7c1" stroke-width="1.5" filter="url(#shadow)"/><rect x="668" y="146" width="190" height="24" rx="12" fill="#fdecea"/><text x="763.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c0392b" text-anchor="middle" opacity="1">RED · NEVER</text><text x="668" y="194" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Confidential or unverifiable use</text><circle cx="676" cy="216" r="4" fill="#c0392b"/><text x="688" y="220" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Upload client audio or documents</text><circle cx="676" cy="250" r="4" fill="#c0392b"/><text x="688" y="254" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Invent a missing value</text><circle cx="676" cy="284" r="4" fill="#c0392b"/><text x="688" y="288" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Let a model make the final decision</text><circle cx="676" cy="318" r="4" fill="#c0392b"/><text x="688" y="322" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Paste private content into a chat</text><circle cx="676" cy="352" r="4" fill="#c0392b"/><text x="688" y="356" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Trust a citation without opening it</text><circle cx="676" cy="386" r="4" fill="#c0392b"/><text x="688" y="390" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Decide a legal or policy outcome</text><rect x="40" y="476" width="880" height="34" rx="9" fill="#ffffff" stroke="#dbe3ee"/><text x="58" y="498" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="start" opacity="1">Five-second check: client permission? · de-identified? · verifiable? · explainable to QA? · am I still deciding?</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
