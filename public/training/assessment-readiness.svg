<rect x="40" y="126" width="880" height="344" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="62" y="150" width="194" height="146" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><circle cx="90" cy="178" r="15" fill="#2f5bd3" opacity="0.12"/><text x="90" y="183" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2f5bd3" text-anchor="middle" opacity="1">1</text><text x="80" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">The brief</text><text x="80" y="236" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Deliverable · source of</text><text x="80" y="252" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">truth · format ·</text><text x="80" y="268" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">exceptions · deadline</text><rect x="276" y="150" width="194" height="146" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><circle cx="304" cy="178" r="15" fill="#0f9d6b" opacity="0.12"/><text x="304" y="183" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">2</text><text x="294" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">The standard</text><text x="294" y="236" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Every audible word</text><text x="294" y="252" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">accounted for; uncertainty</text><text x="294" y="268" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">tagged</text><rect x="490" y="150" width="194" height="146" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><circle cx="518" cy="178" r="15" fill="#c8870a" opacity="0.12"/><text x="518" y="183" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c8870a" text-anchor="middle" opacity="1">3</text><text x="508" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">The risk</text><text x="508" y="236" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">What would you refuse, tag</text><text x="508" y="252" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">or escalate?</text><rect x="704" y="150" width="194" height="146" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><circle cx="732" cy="178" r="15" fill="#7c3aed" opacity="0.12"/><text x="732" y="183" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle" opacity="1">4</text><text x="722" y="214" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">The handoff</text><text x="722" y="236" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Could a reviewer reproduce</text><text x="722" y="252" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">your work?</text><rect x="62" y="320" width="836" height="104" rx="12" fill="#f2fbf7" stroke="#bfe8d7"/><text x="84" y="350" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f9d6b" text-anchor="start" opacity="1">Pass target</text><text x="84" y="382" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0f9d6b" text-anchor="start" opacity="1">17 of 25</text><text x="84" y="404" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">correct answers</text><text x="300" y="352" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="start" opacity="1">Concept questions</text><text x="300" y="382" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">~60%</text><text x="490" y="352" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="start" opacity="1">Scenario questions</text><text x="490" y="382" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">~30%</text><text x="680" y="352" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="start" opacity="1">Visual questions</text><text x="680" y="382" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">~10%</text><text x="62" y="452" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">If a station feels vague, reread that unit before you start. The assessment finds gaps; it does not create them.</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
