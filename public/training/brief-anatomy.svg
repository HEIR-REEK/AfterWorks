<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Read the brief like an acceptance test</title>
<desc>Six parts turn a paragraph into a checklist you can pass.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12" fill="#e8eefc"/>
<text x="135" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · ACADEMY</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Read the brief like an acceptance test</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">Six parts turn a paragraph into a checklist you can pass.</text>
<rect x="40" y="126" width="430" height="346" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="62" y="146" width="170" height="24" rx="12" fill="#e8eefc"/><text x="147.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e3f9e" text-anchor="middle" opacity="1">CLIENT BRIEF · JOB-1042</text><rect x="62" y="188" width="384" height="32" rx="7" fill="#eef3fd" stroke="#dbe3ee"/><text x="74" y="208" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">1. Deliverable</text><text x="196" y="208" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Speaker-labelled transcript</text><rect x="62" y="230" width="384" height="32" rx="7" fill="#ffffff" stroke="#dbe3ee"/><text x="74" y="250" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">2. Scope</text><text x="196" y="250" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">12-minute call · 3 speakers</text><rect x="62" y="272" width="384" height="32" rx="7" fill="#eef3fd" stroke="#dbe3ee"/><text x="74" y="292" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">3. Format</text><text x="196" y="292" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">DOCX · timecodes at changes</text><rect x="62" y="314" width="384" height="32" rx="7" fill="#ffffff" stroke="#dbe3ee"/><text x="74" y="334" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">4. Standard</text><text x="196" y="334" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Faithful words · tag unclear</text><rect x="62" y="356" width="384" height="32" rx="7" fill="#eef3fd" stroke="#dbe3ee"/><text x="74" y="376" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">5. Exceptions</text><text x="196" y="376" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Use [inaudible] · log names</text><rect x="62" y="398" width="384" height="32" rx="7" fill="#ffffff" stroke="#dbe3ee"/><text x="74" y="418" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">6. Handoff</text><text x="196" y="418" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Upload by 18:00 EAT</text><text x="62" y="446" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">A brief without one of these is a question, not an instruction.</text><rect x="500" y="126" width="420" height="346" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="522" y="158" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Six questions before you start</text><circle cx="532" cy="188" r="9" fill="#e8f8f1"/><text x="532" y="192" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">1</text><text x="552" y="192" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">What exactly do I hand over?</text><circle cx="532" cy="226" r="9" fill="#e8f8f1"/><text x="532" y="230" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">2</text><text x="552" y="230" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Which sources are in scope?</text><circle cx="532" cy="264" r="9" fill="#e8f8f1"/><text x="532" y="268" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">3</text><text x="552" y="268" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">What format must I not break?</text><circle cx="532" cy="302" r="9" fill="#e8f8f1"/><text x="532" y="306" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">4</text><text x="552" y="306" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">What quality rule matters most?</text><circle cx="532" cy="340" r="9" fill="#e8f8f1"/><text x="532" y="344" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">5</text><text x="552" y="344" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">What do I do with exceptions?</text><circle cx="532" cy="378" r="9" fill="#e8f8f1"/><text x="532" y="382" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">6</text><text x="552" y="382" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">When and where does it go?</text><rect x="522" y="420" width="376" height="30" rx="8" fill="#fffaf0" stroke="#f0ddae"/><text x="538" y="440" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#c8870a" text-anchor="start" opacity="1">Unclear? Ask one specific question early.</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
