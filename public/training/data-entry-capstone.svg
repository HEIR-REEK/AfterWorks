" height="36" rx="7" fill="#fffaf0" stroke="#f0ddae"/><text x="632" y="356" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c8870a" text-anchor="start" opacity="1">DOC-032</text><text x="632" y="369" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Duplicate receipt?</text><path d="M562 270 L596 270" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="260" y="426" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Validate a sample after ten rows. If the map is wrong, fix it before the batch grows.</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
