<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Three boxes, three verdicts</title>
<desc>Tightness is not decoration. It is the difference between a usable label and a rejected one.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12.0" fill="#e8eefc" stroke="none" stroke-width="1.5" /><text x="135.0" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · TRAINING</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Three boxes, three verdicts</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="start">Tightness is not decoration. It is the difference between a usable label and a rejected one.</text>

<rect x="40" y="126" width="280" height="300" rx="14" fill="#f2fbf7" stroke="#bfe8d7" stroke-width="1.5" />
<rect x="60" y="144" width="90" height="24" rx="12.0" fill="#e8f8f1" stroke="none" stroke-width="1.5" /><text x="105.0" y="159.24" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f9d6b" text-anchor="middle">A · TIGHT</text>
<rect x="64" y="190" width="230" height="130" rx="8" fill="#dce7fb" stroke="none" stroke-width="1.5" />
<rect x="120" y="238" width="114" height="46" rx="7" fill="#2f5bd3" stroke="#dbe3ee" stroke-width="1.5" opacity="0.85" />
<rect x="118" y="236" width="118" height="50" rx="4" fill="none" stroke="#0f9d6b" stroke-width="3" />
<text x="64" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f9d6b" text-anchor="start">Every edge touches the</text>
<text x="64" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f9d6b" text-anchor="start">visible outer pixels.</text>
<text x="64" y="394" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">This is the QA standard.</text>

<rect x="340" y="126" width="280" height="300" rx="14" fill="#fffaf0" stroke="#f0ddae" stroke-width="1.5" />
<rect x="360" y="144" width="92" height="24" rx="12.0" fill="#fff6df" stroke="none" stroke-width="1.5" /><text x="406.0" y="159.24" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#c8870a" text-anchor="middle">B · LOOSE</text>
<rect x="364" y="190" width="230" height="130" rx="8" fill="#dce7fb" stroke="none" stroke-width="1.5" />
<rect x="120" y="238" width="114" height="46" rx="7" fill="#2f5bd3" stroke="#dbe3ee" stroke-width="1.5" opacity="0.85" transform="translate(244,0)"/>
<rect x="104" y="222" width="146" height="78" rx="6" fill="none" stroke="#c8870a" stroke-width="3" transform="translate(260,0)"/>
<text x="364" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c8870a" text-anchor="start">Includes road, shadow and</text>
<text x="364" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c8870a" text-anchor="start">empty space.</text>
<text x="364" y="394" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">QA rejects it: not tight.</text>

<rect x="640" y="126" width="280" height="300" rx="14" fill="#eef3fd" stroke="#c9d7f4" stroke-width="1.5" />
<rect x="660" y="144" width="112" height="24" rx="12.0" fill="#e8eefc" stroke="none" stroke-width="1.5" /><text x="716.0" y="159.24" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1e3f9e" text-anchor="middle">C · OCCLUDED</text>
<rect x="664" y="190" width="230" height="130" rx="8" fill="#dce7fb" stroke="none" stroke-width="1.5" />
<rect x="722" y="238" width="112" height="46" rx="7" fill="#2f5bd3" stroke="#dbe3ee" stroke-width="1.5" opacity="0.85" />
<rect x="736" y="190" width="0" height="0" rx="14" fill="none" stroke="#dbe3ee" stroke-width="1.5" />
<rect x="770" y="220" width="56" height="94" rx="6" fill="#5d8a5f" stroke="#dbe3ee" stroke-width="1.5" opacity="0.82" />
<rect x="718" y="236" width="56" height="50" rx="4" fill="none" stroke="#2f5bd3" stroke-width="3" />
<text x="664" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3f9e" text-anchor="start">Box only the visible half;</text>
<text x="664" y="368" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3f9e" text-anchor="start">stop at the occlusion.</text>
<text x="664" y="394" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Do not invent hidden pixels.</text>

<text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
