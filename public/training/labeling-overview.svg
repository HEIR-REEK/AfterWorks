<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Image labeling: tight boxes, right class</title>
<desc>The model learns from exactly what you box — including your mistakes.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12.0" fill="#e8eefc" stroke="none" stroke-width="1.5" /><text x="135.0" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · TRAINING</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Image labeling: tight boxes, right class</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="start">The model learns from exactly what you box — including your mistakes.</text>

<rect x="40" y="126" width="546" height="372" rx="14" fill="#e8efff" stroke="#c9d7f4" stroke-width="1.5" />
<text x="62" y="154" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1e3f9e" text-anchor="start">STREET SCENE  ·  frame 01842</text>
<rect x="40" y="176" width="546" height="230" rx="0" fill="#dce7fb" stroke="none" stroke-width="1.5" />
<rect x="40" y="340" width="546" height="66" rx="0" fill="#c8d4cc" stroke="none" stroke-width="1.5" />
<text x="60" y="306" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start">sky</text>
<rect x="220" y="288" width="130" height="54" rx="8" fill="#2f5bd3" stroke="#dbe3ee" stroke-width="1.5" opacity="0.85" />
<text x="285" y="318" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">car</text>
<rect x="226" y="294" width="118" height="42" rx="4" fill="none" stroke="#0f9d6b" stroke-width="3" />
<circle cx="442" cy="322" r="11" fill="#f0b45a" stroke="none" stroke-width="0"/>
<rect x="452" y="336" width="16" height="52" rx="5" fill="#5b6b8a" stroke="#dbe3ee" stroke-width="1.5" />
<rect x="432" y="319" width="38" height="76" rx="5" fill="none" stroke="#0f9d6b" stroke-width="3" />
<text x="451" y="420" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f9d6b" text-anchor="middle">tight box around the visible pixels</text>
<rect x="120" y="254" width="84" height="96" rx="6" fill="#5d8a5f" stroke="#dbe3ee" stroke-width="1.5" opacity="0.7" />
<text x="162" y="244" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">tree</text>
<text x="62" y="468" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e3f9e" text-anchor="start">Do not box the shadow  ·  do not estimate the hidden half of an object</text>

<rect x="604" y="126" width="316" height="372" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" />
<text x="626" y="160" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="start">TOOLBAR</text>
<rect x="626" y="174" width="58" height="28" rx="14.0" fill="#eef3fd" stroke="none" stroke-width="1.5" /><text x="655.0" y="191.96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3f9e" text-anchor="middle">car</text>
<rect x="692" y="174" width="72" height="28" rx="14.0" fill="#f2fbf7" stroke="none" stroke-width="1.5" /><text x="728.0" y="191.96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f9d6b" text-anchor="middle">person</text>
<rect x="772" y="174" width="58" height="28" rx="14.0" fill="#fff6df" stroke="none" stroke-width="1.5" /><text x="801.0" y="191.96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c8870a" text-anchor="middle">sign</text>
<text x="626" y="238" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">1  Choose the class</text>
<text x="626" y="258" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">The most specific label available.</text>
<text x="626" y="296" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">2  Draw a tight box</text>
<text x="626" y="316" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Edge to edge on visible pixels.</text>
<text x="626" y="354" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">3  Review the edges</text>
<text x="626" y="374" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Occluded? Stop at the occlusion.</text>
<rect x="626" y="408" width="272" height="62" rx="9" fill="#fff6df" stroke="none" stroke-width="1.5" />
<text x="642" y="432" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c8870a" text-anchor="start">A loose box teaches the model</text>
<text x="642" y="449" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c8870a" text-anchor="start">the wrong shape. Tighten it.</text>

<text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
