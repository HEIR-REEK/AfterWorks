<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>The quality loop</title>
<desc>Fix the work, then fix the reason the work needed fixing.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12" fill="#e8eefc"/>
<text x="135" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · ACADEMY</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a">The quality loop</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">Fix the work, then fix the reason the work needed fixing.</text>
<circle cx="480" cy="330" r="78" fill="#eef3fd" stroke="#dbe3ee" stroke-width="1.5"/><text x="480" y="324" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2f5bd3" text-anchor="middle">Same error</text><text x="480" y="346" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2f5bd3" text-anchor="middle">never twice</text><rect x="240" y="198" width="190" height="86" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="258" y="226" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">1 · Plan</text><text x="258" y="250" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Brief + checklist</text><rect x="650" y="198" width="190" height="86" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="668" y="226" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">2 · Inspect</text><text x="668" y="250" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Verify against source</text><rect x="650" y="372" width="190" height="86" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="668" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">3 · Classify</text><text x="668" y="424" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Accuracy · structure ·</text><text x="668" y="440" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">compliance · judgement</text><rect x="240" y="372" width="190" height="86" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="258" y="400" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">4 · Change</text><text x="258" y="424" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start">Prevention rule</text><path d="M430 241 L640 241" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M745 284 L745 362" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M650 415 L440 415" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M240 372 L240 288" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="478" width="880" height="34" rx="9" fill="#ffffff" stroke="#dbe3ee"/><text x="58" y="500" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="start">Feedback → root cause → prevention rule. A correction without a prevention step is only a repair.</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
