<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Research: find it, verify it, cite it</title>
<desc>A fact is only usable when a second person can follow your URL and see the same thing.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12.0" fill="#e8eefc" stroke="none" stroke-width="1.5" /><text x="135.0" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · TRAINING</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Research: find it, verify it, cite it</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="start">A fact is only usable when a second person can follow your URL and see the same thing.</text>

<rect x="40" y="126" width="880" height="58" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" />
<circle cx="66" cy="155" r="12" fill="#eef3fd" stroke="none" stroke-width="0"/>
<text x="66" y="160" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e3f9e" text-anchor="middle">?</text>
<text x="92" y="161" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#64748b" text-anchor="start">business name  +  official website</text>
<rect x="760" y="143" width="118" height="28" rx="14.0" fill="#eef3fd" stroke="none" stroke-width="1.5" /><text x="819.0" y="160.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">SEARCH</text>

<rect x="40" y="206" width="205" height="190" rx="14" fill="#f2fbf7" stroke="#bfe8d7" stroke-width="1.5" />
<rect x="58" y="222" width="70" height="22" rx="11.0" fill="#e8f8f1" stroke="none" stroke-width="1.5" /><text x="93.0" y="235.88" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#0f9d6b" text-anchor="middle">PRIMARY</text>
<text x="58" y="268" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f9d6b" text-anchor="start">Official website</text>
<text x="58" y="290" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Contact + About pages</text>
<text x="58" y="312" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Company registry</text>
<text x="58" y="334" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Regulator listing</text>

<rect x="265" y="206" width="205" height="190" rx="14" fill="#fffaf0" stroke="#f0ddae" stroke-width="1.5" />
<rect x="283" y="222" width="100" height="22" rx="11.0" fill="#fff6df" stroke="none" stroke-width="1.5" /><text x="333.0" y="235.88" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#c8870a" text-anchor="middle">CROSS-CHECK</text>
<text x="283" y="268" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#c8870a" text-anchor="start">Reputable directory</text>
<text x="283" y="290" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Use to confirm a detail</text>
<text x="283" y="312" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Not the only source</text>
<text x="283" y="334" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Check the date</text>

<rect x="490" y="206" width="205" height="190" rx="14" fill="#fdf4f2" stroke="#f0c7c1" stroke-width="1.5" />
<rect x="508" y="222" width="98" height="22" rx="11.0" fill="#fdecea" stroke="none" stroke-width="1.5" /><text x="557.0" y="235.88" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#c0392b" text-anchor="middle">NOT PRIMARY</text>
<text x="508" y="268" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#c0392b" text-anchor="start">Blogs &amp; social posts</text>
<text x="508" y="290" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Unsourced claims</text>
<text x="508" y="312" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Old screenshots</text>
<text x="508" y="334" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">“Call for details”</text>

<rect x="715" y="206" width="205" height="190" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" />
<rect x="733" y="222" width="76" height="22" rx="11.0" fill="#eef3fd" stroke="none" stroke-width="1.5" /><text x="771.0" y="235.88" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#1e3f9e" text-anchor="middle">RECORD</text>
<text x="733" y="268" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e3f9e" text-anchor="start">Exact page URL</text>
<text x="733" y="290" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Date checked</text>
<text x="733" y="312" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">What the field says</text>
<text x="733" y="334" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Confidence note</text>

<rect x="40" y="426" width="880" height="62" rx="14" fill="#eef3fd" stroke="#c9d7f4" stroke-width="1.5" />
<text x="60" y="452" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e3f9e" text-anchor="start">The homepage is not a source.</text>
<text x="60" y="473" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#1e3f9e" text-anchor="start">Record the deep link to the page that actually shows the fact — and the date you saw it.</text>

<text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
