<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Which source wins?</title>
<desc>When two pages disagree, the official primary source is the tie-breaker — not the loudest one.</desc>
