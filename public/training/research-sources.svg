="9" fill="#fdecea" stroke="none" stroke-width="1.5" /><circle cx="90" cy="415" r="15" fill="#c0392b" stroke="none" stroke-width="0"/><text x="90" y="420" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="116" y="411" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="start">Blog, social post, screenshot</text><text x="116" y="429" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#c0392b" text-anchor="start">Not primary — do not cite alone</text>

