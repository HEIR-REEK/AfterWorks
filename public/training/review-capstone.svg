<text x="135" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · ACADEMY</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Capstone: five borderline decisions</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">Apply the policy, read the context, and leave a note a second reviewer can defend.</text>
<rect x="40" y="126" width="205" height="224" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="56" y="146" width="82" height="24" rx="12" fill="#0f9d6b22"/><text x="97.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">ALLOW</text><text x="56" y="200" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">No violation;</text><text x="56" y="217" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">context matters</text><rect x="56" y="236" width="173" height="6" rx="3" fill="#0f9d6b" opacity="0.7"/><text x="56" y="270" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Policy category + context</text><text x="56" y="288" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">+ evidence in the note</text><text x="56" y="328" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f9d6b" text-anchor="start" opacity="1">Station 1</text><rect x="265" y="126" width="205" height="224" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="281" y="146" width="82" height="24" rx="12" fill="#c8870a22"/><text x="322.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c8870a" text-anchor="middle" opacity="1">REVIEW</text><text x="281" y="200" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Ambiguous;</text><text x="281" y="217" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">document the call</text><rect x="281" y="236" width="173" height="6" rx="3" fill="#c8870a" opacity="0.7"/><text x="281" y="270" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Policy category + context</text><text x="281" y="288" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">+ evidence in the note</text><text x="281" y="328" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c8870a" text-anchor="start" opacity="1">Station 2</text><rect x="490" y="126" width="205" height="224" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="506" y="146" width="82" height="24" rx="12" fill="#c0392b22"/><text x="547.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c0392b" text-anchor="middle" opacity="1">REMOVE</text><text x="506" y="200" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Policy violation;</text><text x="506" y="217" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">preserve evidence</text><rect x="506" y="236" width="173" height="6" rx="3" fill="#c0392b" opacity="0.7"/><text x="506" y="270" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Policy category + context</text><text x="506" y="288" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">+ evidence in the note</text><text x="506" y="328" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start" opacity="1">Station 3</text><rect x="715" y="126" width="205" height="224" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="731" y="146" width="82" height="24" rx="12" fill="#f3e8ff"/><text x="772.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="middle" opacity="1">ESCALATE</text><text x="731" y="200" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Credible risk or</text><text x="731" y="217" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">specialist process</text><rect x="731" y="236" width="173" height="6" rx="3" fill="#7c3aed" opacity="0.7"/><text x="731" y="270" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Policy category + context</text><text x="731" y="288" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">+ evidence in the note</text><text x="731" y="328" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="start" opacity="1">Station 4</text><rect x="40" y="376" width="880" height="100" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="62" y="404" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="start" opacity="1">The five cards in the lab</text><text x="62" y="430" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Sarcastic threat between friends  ·  medical misinformation  ·  reclaimed slur in context  ·  copyright complaint  ·  coordinated harassment</text><text x="62" y="452" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Each one needs a different rung on the ladder — and a written reason.</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
