<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>A decision you can defend</title>
<desc>The same policy, applied the same way, even when the content is unpleasant.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12.0" fill="#e8eefc" stroke="none" stroke-width="1.5" /><text x="135.0" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · TRAINING</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">A decision you can defend</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="start">The same policy, applied the same way, even when the content is unpleasant.</text>

<rect x="40" y="126" width="880" height="86" rx="14" fill="#eef3fd" stroke="#c9d7f4" stroke-width="1.5" />
<text x="480" y="164" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800" fill="#1e3f9e" text-anchor="middle">Is there a clear policy violation?</text>
<text x="480" y="190" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Read the whole post and the surrounding context before answering.</text>
<line x1="320" y1="212" x2="220" y2="260" stroke="#2f5bd3" stroke-width="2" stroke-linecap="round"/>
<line x1="480" y1="212" x2="480" y2="260" stroke="#2f5bd3" stroke-width="2" stroke-linecap="round"/>
<line x1="640" y1="212" x2="740" y2="260" stroke="#2f5bd3" stroke-width="2" stroke-linecap="round"/>
<rect x="80" y="270" width="280" height="150" rx="14" fill="#e8f8f1" stroke="#bfe8d7" stroke-width="1.5" />
<text x="220" y="304" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="800" fill="#0f9d6b" text-anchor="middle">NO</text>
<text x="220" y="338" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800" fill="#0f9d6b" text-anchor="middle">Allow</text>
<text x="220" y="366" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#0f9d6b" text-anchor="middle">Offensive is not automatically</text>
<text x="220" y="384" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#0f9d6b" text-anchor="middle">a violation. Do not invent a rule.</text>
<rect x="340" y="270" width="280" height="150" rx="14" fill="#fff6df" stroke="#f0ddae" stroke-width="1.5" />
<text x="480" y="304" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="800" fill="#c8870a" text-anchor="middle">NOT SURE</text>
<text x="480" y="338" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800" fill="#c8870a" text-anchor="middle">Escalate</text>
<text x="480" y="366" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#c8870a" text-anchor="middle">Context, satire, or a possible</text>
<text x="480" y="384" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#c8870a" text-anchor="middle">threat goes to a human reviewer.</text>
<rect x="600" y="270" width="280" height="150" rx="14" fill="#fdecea" stroke="#f0c7c1" stroke-width="1.5" />
<text x="740" y="304" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="800" fill="#c0392b" text-anchor="middle">YES</text>
<text x="740" y="338" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800" fill="#c0392b" text-anchor="middle">Remove + tag</text>
<text x="740" y="366" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#c0392b" text-anchor="middle">Pick the most specific violation</text>
<text x="740" y="384" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#c0392b" text-anchor="middle">and leave a short audit note.</text>
<rect x="80" y="450" width="800" height="54" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" />
<text x="100" y="482" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c0392b" text-anchor="start">Imminent self-harm, credible threats, or CSAM: stop and escalate immediately — do not keep scrolling.</text>

<text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
