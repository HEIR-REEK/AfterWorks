<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Content review: policy first, opinion second</title>
<desc>A consistent decision with a written reason is the product. A “feeling” is not.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/>
  </marker>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12.0" fill="#e8eefc" stroke="none" stroke-width="1.5" /><text x="135.0" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · TRAINING</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a" text-anchor="start">Content review: policy first, opinion second</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="start">A consistent decision with a written reason is the product. A “feeling” is not.</text>

<rect x="40" y="126" width="250" height="340" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" />
<text x="60" y="156" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748b" text-anchor="start">QUEUE</text>
<rect x="58" y="176" width="214" height="76" rx="9" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5" /><text x="70" y="203" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="start">“Cheap replicas — DM me.”</text><text x="70" y="226" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="start">possible spam</text><rect x="58" y="268" width="214" height="76" rx="9" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5" /><text x="70" y="295" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="start">“You are useless. Go away.”</text><text x="70" y="318" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="start">targeted insult</text><rect x="58" y="360" width="214" height="76" rx="9" fill="#f8fafc" stroke="#dbe3ee" stroke-width="1.5" /><text x="70" y="387" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="start">“This is terrible.”</text><text x="70" y="410" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="start">opinion, no target</text>
<path d="M300 296 L330 296" stroke="#2f5bd3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="344" y="126" width="270" height="340" rx="14" fill="#eef3fd" stroke="#c9d7f4" stroke-width="1.5" />
<circle cx="479" cy="194" r="34" fill="#2f5bd3" stroke="none" stroke-width="0"/>
<text x="479" y="203" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">§</text>
<text x="479" y="252" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="800" fill="#1e3f9e" text-anchor="middle">POLICY CHECK</text>
<text x="479" y="284" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#1e3f9e" text-anchor="middle">Is there a rule that</text>
<text x="479" y="302" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#1e3f9e" text-anchor="middle">covers this content?</text>
<text x="479" y="338" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Context + exact wording</text>
<text x="479" y="356" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">beats personal reaction.</text>
<path d="M620 296 L650 296" stroke="#2f5bd3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="664" y="126" width="256" height="340" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" />
<text x="684" y="156" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700" fill="#64748b" text-anchor="start">DECISION</text>
<rect x="682" y="176" width="220" height="76" rx="9" fill="#e8f8f1" stroke="none" stroke-width="1.5" /><text x="698" y="206" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f9d6b" text-anchor="start">Allow</text><text x="698" y="228" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f9d6b" text-anchor="start">no violation</text><rect x="682" y="268" width="220" height="76" rx="9" fill="#fdecea" stroke="none" stroke-width="1.5" /><text x="698" y="298" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#c0392b" text-anchor="start">Remove + tag</text><text x="698" y="320" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#c0392b" text-anchor="start">clear violation</text><rect x="682" y="360" width="220" height="76" rx="9" fill="#fff6df" stroke="none" stroke-width="1.5" /><text x="698" y="390" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#c8870a" text-anchor="start">Escalate</text><text x="698" y="412" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#c8870a" text-anchor="start">risk or ambiguity</text>
<text x="60" y="498" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">Write the reason you can defend, not the one that is quickest.</text>

<text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
