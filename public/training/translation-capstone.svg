<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Capstone: one message, two audiences</title>
<desc>Keep the facts and the legal effect. Change the register, not the truth.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12" fill="#e8eefc"/>
<text x="135" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · ACADEMY</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Capstone: one message, two audiences</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">Keep the facts and the legal effect. Change the register, not the truth.</text>
<rect x="40" y="126" width="250" height="256" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="62" y="146" width="94" height="24" rx="12" fill="#e8eefc"/><text x="109.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e3f9e" text-anchor="middle" opacity="1">SOURCE · EN</text><text x="62" y="190" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Launch message</text><text x="62" y="220" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">New product, same trusted</text><text x="62" y="242" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">service. Book before Friday</text><text x="62" y="264" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">and save 20%. Terms apply.</text><text x="62" y="304" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="start" opacity="1">Idiom + date + price +</text><text x="62" y="322" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="start" opacity="1">product name + disclaimer</text><path d="M294 252 L332 196" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M294 252 L332 338" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="340" y="126" width="250" height="220" rx="14" fill="#f2fbf7" stroke="#bfe8d7" stroke-width="1.5" filter="url(#shadow)"/><rect x="360" y="146" width="124" height="24" rx="12" fill="#e8f8f1"/><text x="422.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">FORMAL · PARTNER</text><text x="360" y="190" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Register: precise</text><text x="360" y="214" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Keep legal terms</text><text x="360" y="234" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Keep full disclaimer</text><text x="360" y="254" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Localise date format</text><text x="360" y="296" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f9d6b" text-anchor="start" opacity="1">Glossary terms unchanged</text><rect x="610" y="126" width="310" height="220" rx="14" fill="#fffaf0" stroke="#f0ddae" stroke-width="1.5" filter="url(#shadow)"/><rect x="630" y="146" width="140" height="24" rx="12" fill="#fff6df"/><text x="700.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c8870a" text-anchor="middle" opacity="1">CONSUMER · SOCIAL</text><text x="630" y="190" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Register: conversational</text><text x="630" y="214" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Transcreate the idiom</text><text x="630" y="234" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Same facts and price</text><text x="630" y="254" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Keep legal disclaimer</text><text x="630" y="296" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#c8870a" text-anchor="start" opacity="1">Tone changes · meaning stays</text><rect x="340" y="366" width="580" height="96" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="362" y="394" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2f5bd3" text-anchor="start" opacity="1">Review pass</text><text x="362" y="417" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Numbers · dates · tags · brand terms · disclaimer · register consistency</text><text x="362" y="439" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Two versions pass only when a reader cannot find a factual difference.</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
