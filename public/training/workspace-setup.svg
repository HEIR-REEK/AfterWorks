<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>Set up a professional workspace</title>
<desc>Keep the source safe, the draft honest and the deliverable obvious.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5bd3"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="960" height="540" fill="#f4f7fb"/>
<circle cx="900" cy="20" r="150" fill="#2f5bd3" opacity="0.06"/>
<circle cx="60" cy="530" r="120" fill="#0f9d6b" opacity="0.06"/>
<rect x="40" y="26" width="190" height="24" rx="12" fill="#e8eefc"/>
<text x="135" y="41.6" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3f9e" text-anchor="middle">AFTERWORKS · ACADEMY</text>
<text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Set up a professional workspace</text>
<text x="40" y="101" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b">Keep the source safe, the draft honest and the deliverable obvious.</text>
<rect x="40" y="126" width="270" height="284" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="62" y="146" width="76" height="24" rx="12" fill="#e8eefc"/><text x="100.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e3f9e" text-anchor="middle" opacity="1">SOURCE</text><rect x="62" y="186" width="100" height="128" rx="8" fill="#eef3fd" stroke="#dbe3ee" stroke-width="1.5"/><rect x="78" y="204" width="68" height="7" rx="3.5" fill="#2f5bd3" opacity="0.8"/><rect x="78" y="226" width="60" height="5" rx="2.5" fill="#64748b" opacity="0.5"/><rect x="78" y="244" width="48" height="5" rx="2.5" fill="#64748b" opacity="0.5"/><rect x="78" y="262" width="60" height="5" rx="2.5" fill="#64748b" opacity="0.5"/><rect x="78" y="280" width="48" height="5" rx="2.5" fill="#64748b" opacity="0.5"/><text x="180" y="210" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Client source</text><text x="180" y="232" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Never edit the original.</text><text x="180" y="252" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Keep it in the approved</text><text x="180" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">workspace.</text><text x="62" y="350" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f9d6b" text-anchor="start" opacity="1">Read-only source</text><text x="62" y="372" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">A reviewer can always</text><text x="62" y="388" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">compare back to it.</text><rect x="345" y="126" width="270" height="284" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="367" y="146" width="112" height="24" rx="12" fill="#e8eefc"/><text x="423.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e3f9e" text-anchor="middle" opacity="1">WORKING DRAFT</text><text x="367" y="194" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Speaker / field notes</text><rect x="367" y="214" width="226" height="22" rx="6" fill="#eef3fd"/><text x="378" y="229" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2f5bd3" text-anchor="start" opacity="1">Speaker map</text><rect x="367" y="244" width="226" height="22" rx="6" fill="#eef3fd"/><text x="378" y="259" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2f5bd3" text-anchor="start" opacity="1">Names to verify</text><rect x="367" y="274" width="226" height="22" rx="6" fill="#eef3fd"/><text x="378" y="289" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2f5bd3" text-anchor="start" opacity="1">Open question</text><rect x="367" y="316" width="226" height="54" rx="8" fill="#fffaf0" stroke="#f0ddae"/><text x="380" y="336" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c8870a" text-anchor="start" opacity="1">Exception log</text><text x="380" y="354" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#c8870a" text-anchor="start" opacity="1">“Timestamp 04:18, name uncertain”</text><text x="367" y="392" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Placeholders are allowed here.</text><rect x="650" y="126" width="270" height="284" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5" filter="url(#shadow)"/><rect x="672" y="146" width="94" height="24" rx="12" fill="#e8eefc"/><text x="719.0" y="162" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1e3f9e" text-anchor="middle" opacity="1">DELIVERABLE</text><rect x="672" y="190" width="76" height="100" rx="8" fill="#f2fbf7" stroke="#bfe8d7" stroke-width="1.5"/><text x="710" y="232" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#0f9d6b" text-anchor="middle" opacity="1">✓</text><text x="766" y="204" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">One clean file</text><text x="766" y="226" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Named for the job.</text><text x="766" y="244" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Formatted to brief.</text><text x="766" y="262" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">No scratch notes.</text><text x="672" y="330" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1">Before submit:</text><text x="672" y="352" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">Could a stranger</text><text x="672" y="368" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start" opacity="1">reproduce this?</text><text x="672" y="390" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f9d6b" text-anchor="start" opacity="1">If not, keep working.</text><path d="M310 268 L342 268" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M615 268 L647 268" stroke="#2f5bd3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="430" width="880" height="54" rx="12" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/><text x="62" y="452" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="start" opacity="1">Boundary rule</text><text x="62" y="471" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a" text-anchor="start" opacity="1">Client material stays inside the approved tools — no personal drives, public chats or screenshots.</text><text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b" opacity="0.9">Illustration · not a live screenshot</text>
</svg>
